[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-atlas"
version = "0.2.0"
description = "Validate and render section-level visual reference atlases"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Santi Pochat"}]
dependencies = []

[project.urls]
Repository = "https://github.com/sapochat/reference-atlas"
Documentation = "https://github.com/sapochat/reference-atlas#readme"

[project.scripts]
reference-atlas = "reference_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reference_atlas.resources" = ["starter.json", "atlas-v2.schema.json"]
