[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-atlas"
version = "0.1.0"
description = "Validate and render section-level visual reference atlases"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Santi Pochat"}]

[project.scripts]
reference-atlas = "reference_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
